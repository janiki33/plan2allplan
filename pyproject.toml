[project]
name = "plan2allplan"
version = "0.0.1"
description = "Architect plans (DWG/PDF) -> native Allplan 2026 structural shell model (PythonPart) or IFC4"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "ezdxf>=1.3",
    "pymupdf>=1.24",
    "ifcopenshell>=0.8",
    "shapely>=2.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
plan2allplan = "core.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
